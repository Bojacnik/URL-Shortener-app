# Weekly pull requests for outdated NuGet packages and GitHub Actions.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Avalonia.Headless.XUnit 12.x is built against xunit v3 3.x and fails test discovery
      # on xunit v4 (MissingMethodException). Remove this once Avalonia ships v4 support:
      # https://github.com/AvaloniaUI/Avalonia/issues/22510
      - dependency-name: "xunit*"
        update-types: ["version-update:semver-major"]
    groups:
      # All Avalonia packages must stay on the same version, so update them together.
      avalonia:
        patterns: ["Avalonia*", "AvaloniaUI.*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
