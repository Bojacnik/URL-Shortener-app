# Weekly pull requests for outdated NuGet packages and GitHub Actions.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # All Avalonia packages must stay on the same version, so update them together.
      avalonia:
        patterns: ["Avalonia*", "AvaloniaUI.*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
